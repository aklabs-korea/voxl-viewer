name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: mac/build.sh --universal

      - name: Check the signature
        run: codesign --verify --strict --verbose=2 "build/voxl viewer.app"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish windows/VoxlViewer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/win-x64

      - name: Check the output
        shell: pwsh
        run: |
          if (-not (Test-Path out/win-x64/VoxlViewer.exe)) { throw 'out/win-x64/VoxlViewer.exe is missing' }
